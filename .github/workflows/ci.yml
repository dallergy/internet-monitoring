name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config

      - name: Start monitoring stack
        run: docker compose up -d

      - name: Wait for Prometheus
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9090/-/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "Prometheus did not become ready"
          docker compose ps
          docker compose logs
          exit 1

      - name: Wait for Grafana
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3030/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Grafana did not become ready"
          docker compose ps
          docker compose logs grafana
          exit 1

      - name: Check Prometheus targets
        run: curl -fsS http://localhost:9090/api/v1/targets | grep -q '"health":"up"'

      - name: Tear down
        if: always()
        run: docker compose down -v
