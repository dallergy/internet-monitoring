global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: internet-monitoring

rule_files:
  - alert.rules

scrape_configs:
  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets: [localhost:9090]

  - job_name: speedtest
    scrape_interval: 1m
    scrape_timeout: 30s
    metrics_path: /metrics
    static_configs:
      - targets: [speedtest:9090]

  - job_name: ping
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - pinghosts.yaml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        regex: (.*);(.*);(.*);(.*)
        target_label: instance
        replacement: $1
      - source_labels: [__address__]
        regex: (.*);(.*);(.*);(.*)
        target_label: humanname
        replacement: $2
      - source_labels: [__address__]
        regex: (.*);(.*);(.*);(.*)
        target_label: routing
        replacement: $3
      - source_labels: [__address__]
        regex: (.*);(.*);(.*);(.*)
        target_label: switching
        replacement: $4
      - source_labels: [instance]
        target_label: __param_target
      - target_label: __address__
        replacement: ping:9115

  - job_name: nodeexp
    scrape_interval: 15s
    static_configs:
      - targets: [nodeexp:9100]

  # Optional: start sonos exporter with docker compose --profile sonos up
  # Edit the target below to your Sonos host IP when using the sonos profile.
  - job_name: sonos
    scrape_interval: 30s
    static_configs:
      - targets: [192.168.1.42:1915]
